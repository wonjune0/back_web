server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/back_web?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Seoul
    username: back_web
    password: back_web
  jpa:
    show-sql: true

logging:
  level:
    com.wonjune.backweb: DEBUG
    org.hibernate.SQL: DEBUG

jwt:
  secret: local-only-dev-secret-key-change-me-please-32bytes+
  expiration-ms: 7200000

payment:
  secret-key: local-only-dev-payment-key
  mock:
    # 로컬에서는 실패 주입을 켜 둔다. 결제 실패 화면과 재고 원복을 눈으로 확인하기 위한 것.
    allow-forced-failure: true
